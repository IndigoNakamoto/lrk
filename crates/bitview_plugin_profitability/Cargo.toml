[package]
name = "bitview_plugin_profitability"
description = "UTXO profitability bands for shared age filters"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
litecoin = ["bitview_cohort/litecoin", "bitview_compute/litecoin", "bitview_distribution/litecoin", "bitview_plugin/litecoin", "bitview_plugin_mappings/litecoin", "bitview_primitives/litecoin", "bitview_traversable/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_types/litecoin"]

[dependencies]
bitview_compute = { workspace = true }
bitview_cohort = { workspace = true, features = ["storage"] }
bitview_plugin = { workspace = true }
bitview_distribution = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_traversable = { workspace = true }
bitview_vecs = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
brk_types = { workspace = true, features = ["storage"] }
statedb = { workspace = true }
vecdb = { workspace = true }
