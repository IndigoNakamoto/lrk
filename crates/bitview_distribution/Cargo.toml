[package]
name = "bitview_distribution"
description = "Shared cohort accounting and price maps for distribution plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
litecoin = ["bitview_cohort/litecoin", "bitview_compute/litecoin", "bitview_plugin_indexer/litecoin", "bitview_plugin_mappings/litecoin", "bitview_primitives/litecoin", "bitview_traversable/litecoin", "bitview_urpd/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_types/litecoin"]

[dependencies]
bitview_primitives = { workspace = true, features = ["storage"] }
statedb = { workspace = true }
bitview_compute = { workspace = true }
bitview_urpd = { workspace = true }
bitview_vecs = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_cohort = { workspace = true, features = ["storage"] }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
derive_more = { workspace = true }
schemars = { workspace = true }
vecdb = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
bitview_plugin_indexer = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
brk_exit = { workspace = true }
