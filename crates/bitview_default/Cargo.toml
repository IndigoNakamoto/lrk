[package]
name = "bitview_default"
description = "The default Bitview plugin graph and compute schedule"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"

[features]
litecoin = ["bitview_distribution/litecoin", "bitview_plugin/litecoin", "bitview_plugin_addresses/litecoin", "bitview_plugin_age/litecoin", "bitview_plugin_bedrock/litecoin", "bitview_plugin_blocks/litecoin", "bitview_plugin_coinflow/litecoin", "bitview_plugin_cointime/litecoin", "bitview_plugin_entry/litecoin", "bitview_plugin_holders/litecoin", "bitview_plugin_indexer/litecoin", "bitview_plugin_inputs/litecoin", "bitview_plugin_mappings/litecoin", "bitview_plugin_market/litecoin", "bitview_plugin_mining/litecoin", "bitview_plugin_op_return/litecoin", "bitview_plugin_outputs/litecoin", "bitview_plugin_pools/litecoin", "bitview_plugin_price/litecoin", "bitview_plugin_profitability/litecoin", "bitview_plugin_rarity_meter/litecoin", "bitview_plugin_supply/litecoin", "bitview_plugin_transactions/litecoin", "bitview_plugin_utxo_set/litecoin", "bitview_plugin_utxos/litecoin", "bitview_traversable/litecoin", "bitview_urpd/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_reader/litecoin"]

[dependencies]
bitview_vecs = { workspace = true }
bitview_distribution = { workspace = true }
bitview_urpd = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_addresses = { workspace = true }
bitview_plugin_age = { workspace = true }
bitview_plugin_bedrock = { workspace = true }
bitview_plugin_blocks = { workspace = true }
bitview_plugin_coinflow = { workspace = true }
bitview_plugin_cointime = { workspace = true }
bitview_plugin_entry = { workspace = true }
bitview_plugin_holders = { workspace = true }
bitview_plugin_indexer = { workspace = true }
bitview_plugin_inputs = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_market = { workspace = true }
bitview_plugin_mining = { workspace = true }
bitview_plugin_op_return = { workspace = true }
bitview_plugin_outputs = { workspace = true }
bitview_plugin_pools = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_plugin_profitability = { workspace = true }
bitview_plugin_rarity_meter = { workspace = true }
bitview_plugin_supply = { workspace = true }
bitview_plugin_transactions = { workspace = true }
bitview_plugin_utxo_set = { workspace = true }
bitview_plugin_utxos = { workspace = true }
bitview_traversable = { workspace = true }
brk_alloc = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
brk_reader = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
vecdb = { workspace = true }
