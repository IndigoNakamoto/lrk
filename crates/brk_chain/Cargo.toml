[package]
name = "brk_chain"
description = "Chain primitives for Bitview: the bitcoin crate, or litecoin under the `litecoin` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
litecoin = ["dep:litecoin"]

[dependencies]
bitcoin_crate = { package = "bitcoin", version = "0.32.102", features = ["serde"] }
litecoin = { version = "0.32.8-rc.1", features = ["serde"], optional = true }
