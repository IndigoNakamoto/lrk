[package]
name = "lsm-tree"
description = "A K.I.S.S. implementation of log-structured merge trees (LSM-trees/LSMTs)"
license.workspace = true
version.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "lsm_tree"
path = "src/lib.rs"

[features]
default = []
lz4 = ["dep:lz4_flex"]

[dependencies]
arc-swap = "1.9.2"
byteorder = { package = "byteorder-lite", version = "0.1.0" }
byteview = { workspace = true }
crossbeam-skiplist = "0.1.3"
interval-heap = "0.0.5"
log = { workspace = true }
lz4_flex = { workspace = true, features = ["checked-decode"], optional = true }
quick_cache = { version = "0.7.0", default-features = false, features = [] }
rustc-hash = { workspace = true }
self_cell = "1.3.0"
sfa = "~1.0.0"
tempfile = { workspace = true }
varint-rs = "2.2.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
fs_extra = "1.3.0"
nanoid = "0.5.0"
rand = "0.10.2"
strum = { version = "0.28.0", features = ["derive"] }
test-log = "0.2.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly)',
] }

[[bench]]
name = "merge"
harness = false
path = "benches/merge.rs"
required-features = []

[[bench]]
name = "memtable"
harness = false
path = "benches/memtable.rs"
required-features = []

[[bench]]
name = "bloom"
harness = false
path = "benches/bloom.rs"
required-features = []

[[bench]]
name = "block"
harness = false
path = "benches/block.rs"
required-features = ["lz4"]

[[bench]]
name = "tree"
harness = false
path = "benches/tree.rs"
required-features = ["lz4"]

[[bench]]
name = "level_manifest"
harness = false
path = "benches/level_manifest.rs"
required-features = []

[[bench]]
name = "fd_table"
harness = false
path = "benches/fd_table.rs"
required-features = []
