[package]
name = "bitview_plugin_cointime"
description = "Cointime metrics: coinblocks, liveliness, active and vaulted supply, caps and prices"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
litecoin = ["bitview_cohort/litecoin", "bitview_compute/litecoin", "bitview_distribution/litecoin", "bitview_plugin/litecoin", "bitview_plugin_age/litecoin", "bitview_plugin_holders/litecoin", "bitview_plugin_indexer/litecoin", "bitview_plugin_mappings/litecoin", "bitview_plugin_price/litecoin", "bitview_primitives/litecoin", "bitview_traversable/litecoin", "bitview_urpd/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_types/litecoin"]

[dependencies]
bitview_distribution = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_urpd = { workspace = true }
bitview_vecs = { workspace = true }
brk_exit = { workspace = true }
bitview_compute = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_holders = { workspace = true }
bitview_plugin_age = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_cohort = { workspace = true, features = ["storage"] }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
derive_more = { workspace = true }
rayon = { workspace = true }
vecdb = { workspace = true }
