[package]
name = "bitview_plugin_rarity_meter"
description = "Bitcoin valuation rarity across reference prices and historical extremes"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
litecoin = ["bitview_compute/litecoin", "bitview_plugin/litecoin", "bitview_plugin_coinflow/litecoin", "bitview_plugin_cointime/litecoin", "bitview_plugin_holders/litecoin", "bitview_plugin_indexer/litecoin", "bitview_plugin_mappings/litecoin", "bitview_plugin_price/litecoin", "bitview_primitives/litecoin", "bitview_traversable/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_types/litecoin"]

[dependencies]
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_vecs = { workspace = true }
brk_exit = { workspace = true }
bitview_compute = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_coinflow = { workspace = true }
bitview_plugin_cointime = { workspace = true }
bitview_plugin_holders = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_price = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
rayon = { workspace = true }
schemars = { workspace = true }
vecdb = { workspace = true }
