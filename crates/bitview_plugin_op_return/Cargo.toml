[package]
name = "bitview_plugin_op_return"
description = "Bitcoin OP_RETURN activity by protocol and pre-v30 relay policy for Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
litecoin = ["bitview_compute/litecoin", "bitview_plugin/litecoin", "bitview_plugin_indexer/litecoin", "bitview_plugin_mappings/litecoin", "bitview_plugin_price/litecoin", "bitview_plugin_transactions/litecoin", "bitview_primitives/litecoin", "bitview_traversable/litecoin", "bitview_vecs/litecoin", "brk_error/litecoin", "brk_types/litecoin"]

[dependencies]
bitview_compute = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_vecs = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_plugin_transactions = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
derive_more = { workspace = true }
rayon = { workspace = true }
vecdb = { workspace = true }
